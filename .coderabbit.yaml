language: ko

tone_instructions: >
  1. 단순히 문제를 지적하는 것에 그치지 않고, 왜 문제인지 원인까지 설명해주세요.
  2. 더 나은 코드를 작성할 수 있도록 관련 레퍼런스나 공식 문서를 함께 제안해주세요.
  3. 잘된 부분은 가볍고 유쾌하게 칭찬해주세요.

reviews:
  #리뷰 강도 설정
  profile: "assertive"

  # 자동 리뷰 활성화
  auto_review:
    enabled: true

  # 고수준 요약 포함
  high_level_summary: true

  # 인라인 코멘트 활성화
  poem: false
  review_status: true
  collapse_walkthrough: false

  # 코드 흐름을 시각적으로 파악할 수 있는 시퀀스 다이어그램 생성
  sequence_diagrams: true

  # 리뷰 포커스 영역
  path_instructions:
    - path: "**/*.kt"
      instructions: |
        - Jetpack Compose 구조, 상태 관리, recomposition 최적화에 집중
        - ViewModel, UiState, 단방향 데이터 흐름 패턴 검토
        - 불필요한 recomposition 가능성, remember/derivedStateOf 적절한 사용 확인
        - 네이밍 컨벤션, 가독성, Google 권장 Android 아키텍처 준수 여부

        # Compose Convention
        - @Composable 함수명은 PascalCase를 사용했는지 확인
        - 재사용 가능한 Composable은 modifier: Modifier = Modifier 파라미터를 제공했는지 확인
        - modifier 파라미터는 가능한 첫 번째 optional parameter로 배치했는지 확인
        - Composable 내부에서 하드코딩 색상/폰트 대신 design system 값을 사용하는지 확인
        - 화면 단위 Composable은 state hoisting이 되어 있는지 확인
        - 같은 파일 내 @Composable 함수들은 가독성을 위해 함수 사이에 빈 줄을 유지했는지 확인
        - 이벤트 콜백 파라미터는 `onClick`, `onBackClick`, `onValueChange`처럼 `on` prefix를 사용하는지 확인
        - Preview 함수는 가능한 앱 테마로 감싸 실제 UI와 유사하게 렌더링되는지 확인
        - 재사용 컴포넌트는 ViewModel을 직접 참조하지 않고 필요한 state와 event lambda를 파라미터로 받는지 확인
        - Preview 함수는 실제 화면 함수와 같은 파일 하단에 위치하는지 확인
        - Preview 함수명은 `XXXPreview` 형식을 따르는지 확인
        - Preview 함수는 private으로 선언되어 있는지 확인

        # Google Recommended Architecture
        - 레이어 분리 준수: presentation(ViewModel/Ui) ↔ data(repository/datasource) 의존 방향이 단방향인지 확인
        - 비즈니스 로직이 ViewModel 또는 Repository에 과도하게 섞여 있지 않은지, 책임이 명확한지 확인
        - ViewModel이 Android/IO 디테일에 과하게 의존하지 않는지 확인
          (예: Context 직접 의존, Retrofit DTO/Room Entity를 그대로 UI에 노출)
        - UI(Composable)는 UiState만 관찰하고, 로직/네트워크/상태 변경이 직접 발생하지 않는지 확인
        - UiState는 불변(immutable) 구조로 관리되고, 상태 갱신은 copy/update 패턴으로 일관되게 처리되는지 확인
        - 단발성 이벤트(네비게이션/토스트/스낵바)는 State와 분리되어
          (예: SharedFlow/Channel) 중복 실행·화면 회전 시 재처리 문제가 없는지 확인
        - Repository는 single source of truth 원칙을 따르는지 확인
          (원격/로컬/캐시 데이터 흐름이 한 곳에서 일관되게 관리되는지)
        - Flow/Coroutine 사용이 적절한지 확인
          (viewModelScope 사용, collectLatest/cancellation 고려, dispatcher 분리 여부)
        - 에러 처리 전략이 일관적인지 확인
          (UiState.Error, Result 등으로 UI가 예측 가능하게 상태를 표현하는지)
        - DI(Hilt) 경계 확인
          (ViewModel/Singleton 스코프 적절성, interface 기반 바인딩, 테스트 가능성)
        - 테스트 관점에서 ViewModel과 Repository가
          의존성 주입을 통해 단위 테스트 가능하도록 설계되어 있는지 확인

    - path: "**/*.gradle.kts"
      instructions: |
        - 불필요하거나 중복된 dependency 선언이 없는지 확인
        - version catalog alias 사용이 일관적인지 확인
        - debug/release buildConfigField 값이 안전하게 관리되는지 확인
        - Hilt, KSP, Compose, Firebase 관련 플러그인 적용 위치가 적절한지 확인
        - 사용하지 않는 의존성이 과하게 추가되어 있지 않은지 확인

    - path: "**/AndroidManifest.xml"
      instructions: |
        - INTERNET, POST_NOTIFICATIONS 등 권한 선언이 기능 요구사항에 맞는지 확인
        - Application class 등록 여부와 Hilt 설정이 올바른지 확인
        - exported=true 설정이 필요한 Activity에만 적용되어 있는지 확인
        - 민감한 intent-filter나 권한 노출이 없는지 확인

    - path: "**/data/**/*.kt"
      instructions: |
        - Retrofit DTO와 UI 모델이 직접 섞이지 않는지 확인
        - Repository가 remote/local data source를 적절히 분리하는지 확인
        - kotlinx.serialization 사용 시 nullable/default value 처리가 안전한지 확인
        - 네트워크 에러, HTTP 에러, serialization 에러 처리가 일관적인지 확인

    - path: "**/di/**/*.kt"
      instructions: |
        - Hilt Module의 scope가 적절한지 확인
        - Singleton으로 관리해야 하는 Retrofit, OkHttp, Repository가 중복 생성되지 않는지 확인
        - interface 바인딩과 구현체 제공 방식이 테스트 가능하게 구성되어 있는지 확인

    - path: "**/presentation/**/*.kt"
      instructions: |
        - ViewModel에서 UiState와 UiEvent가 명확히 분리되어 있는지 확인
        - Compose 화면이 ViewModel을 과하게 직접 참조하지 않는지 확인
        - 화면 상태, 로딩, 에러, 빈 상태가 빠짐없이 표현되는지 확인

    - path: "**/signin/**/*.kt"
      instructions: |
        - Credential Manager 기반 Google Sign-In 흐름을 사용하는지 확인
        - Google ID Token을 클라이언트에서 신뢰하지 않고 서버 검증 흐름으로 전달하는지 확인
        - 로그인 실패, 취소, 계정 없음, 네트워크 오류 케이스를 분리해서 처리하는지 확인
        - Firebase Auth를 사용하지 않는 구조라면 불필요한 Firebase Auth 의존성이 추가되지 않았는지 확인

    - path: "**/signal/**/*.kt"
      instructions: |
        - Signal 상태가 Needs action, Waiting, Resolved 등으로 명확히 모델링되어 있는지 확인
        - Signal 액션 처리 후 UI와 로컬 상태가 일관되게 갱신되는지 확인
        - 실시간/푸시 수신 후 상세 데이터 fetch 흐름이 중복 호출되지 않는지 확인

    - path: "**/*Worker.kt"
      instructions: |
        - WorkManager 작업이 재시도, 네트워크 제약, 실패 처리를 적절히 정의하는지 확인
        - Hilt Worker 주입 설정이 올바른지 확인
        - 백그라운드 작업에서 UI 상태나 Activity Context에 의존하지 않는지 확인

  # 리뷰에서 제외할 파일
  path_filters:
    - "!**/build/**"
    - "!**/generated/**"
    - "!**/.gradle/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.webp"
