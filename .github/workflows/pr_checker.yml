name: Momens CI

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: PR Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        env:
          DEBUG_BASE_URL: ${{ secrets.DEBUG_BASE_URL }}
          RELEASE_BASE_URL: ${{ secrets.RELEASE_BASE_URL }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "debug.base.url=\"${DEBUG_BASE_URL}\"" >> local.properties
          echo "release.base.url=\"${RELEASE_BASE_URL}\"" >> local.properties

      - name: Grant permission to gradlew
        run: chmod +x ./gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: Upload ktlint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: |
            app/build/reports/ktlint/
            build/reports/ktlint/

  test:
    name: PR Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        env:
          DEBUG_BASE_URL: ${{ secrets.DEBUG_BASE_URL }}
          RELEASE_BASE_URL: ${{ secrets.RELEASE_BASE_URL }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "debug.base.url=\"${DEBUG_BASE_URL}\"" >> local.properties
          echo "release.base.url=\"${RELEASE_BASE_URL}\"" >> local.properties

      - name: Grant permission to gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

  build:
    name: PR Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        env:
          DEBUG_BASE_URL: ${{ secrets.DEBUG_BASE_URL }}
          RELEASE_BASE_URL: ${{ secrets.RELEASE_BASE_URL }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "debug.base.url=\"${DEBUG_BASE_URL}\"" >> local.properties
          echo "release.base.url=\"${RELEASE_BASE_URL}\"" >> local.properties

      - name: Grant permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: momens-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
